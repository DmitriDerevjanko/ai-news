name: Deploy AI News to Home Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH host key (HOME)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.HOME_PORT }}" "${{ secrets.HOME_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOME_SSH_KEY }}

      - name: Rsync project to home server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.HOME_PORT }}" \
            ./ ${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}:~/ai-news/

            - name: Build & run with Docker Compose (on home)
        run: |
          ssh -p ${{ secrets.HOME_PORT }} ${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }} << 'EOF'
            set -e
            cd ~/ai-news

            # Ensure docker & compose plugin exist
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi

            # Prefer 'docker compose' (v2). If absent, install plugin or fallback to docker-compose.
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="sudo docker-compose"
            else
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin || true
              if docker compose version >/dev/null 2>&1; then
                COMPOSE="sudo docker compose"
              else
                # as a last resort try docker-compose v1
                sudo apt-get install -y docker-compose
                COMPOSE="sudo docker-compose"
              fi
            fi

            # Build & run with prod override (binds to 127.0.0.1:9001)
            \$COMPOSE -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # Cleanup dangling layers (non-fatal)
            sudo docker image prune -f || true
          EOF

