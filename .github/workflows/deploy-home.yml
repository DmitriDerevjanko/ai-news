name: Deploy AI News to Home Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH host key (HOME)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.HOME_PORT }}" "${{ secrets.HOME_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOME_SSH_KEY }}

      - name: Rsync project to home server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.HOME_PORT }}" \
            ./ ${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}:~/ai-news/

      - name: Build & run with Docker Compose (on home)
        run: |
          ssh -p ${{ secrets.HOME_PORT }} ${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }} << 'EOF'
            set -e
            cd ~/ai-news
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f || true
          EOF
