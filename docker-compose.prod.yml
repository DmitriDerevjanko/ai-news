version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_news_api
    expose: ["8000"]
    restart: always

  web:
    image: nginx:1.27-alpine
    container_name: ai_news_web
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./wait-for-it.sh:/wait-for-it.sh
    entrypoint: ["/bin/sh", "-c", "/wait-for-it.sh ai_news_api:8000 -- nginx -g 'daemon off;'"]
    ports:
      - "127.0.0.1:9001:80"
    restart: always
