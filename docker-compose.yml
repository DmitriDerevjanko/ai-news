version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_news_api
    expose:
      - "8000"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: ai_news_web
    depends_on: [api]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
